name: iOS build

on:
  push:
    paths:
      - "CoachMia/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild build \
            -project CoachMia/CoachMia.xcodeproj \
            -target CoachMia \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u
          [ $status -ne 0 ] && tail -40 build.log
          exit $status
