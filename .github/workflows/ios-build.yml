name: iOS build

on:
  push:
    paths:
      - "CoachMia/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild build \
            -project CoachMia/CoachMia.xcodeproj \
            -target CoachMia \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u
          [ $status -ne 0 ] && tail -40 build.log
          exit $status
      - name: Screenshots on iPhone simulator
        if: success()
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" CoachMia/build/Debug-iphonesimulator/CoachMia.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.coachmia.app
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/0-welcome.png
          xcrun simctl terminate "$UDID" com.coachmia.app
          n=1
          for tab in home journey mia sessions community; do
            xcrun simctl launch "$UDID" com.coachmia.app -demoProfile -tab $tab
            sleep 6
            xcrun simctl io "$UDID" screenshot shots/$n-$tab.png
            xcrun simctl terminate "$UDID" com.coachmia.app
            n=$((n+1))
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: screenshots
          path: shots
