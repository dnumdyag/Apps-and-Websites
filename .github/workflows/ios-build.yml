name: iOS build

on:
  push:
    paths:
      - "CoachMia/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    # macOS 26 runners have Xcode 26 and the iOS 26 simulator, which draw Liquid Glass.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild build \
            -project CoachMia/CoachMia.xcodeproj \
            -target CoachMia \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u
          [ $status -ne 0 ] && tail -40 build.log
          exit $status
      - name: Screenshots on iPhone simulator
        if: success()
        run: |
          # Newest iOS runtime; prefer an iPhone 17 Pro, then any iPhone 17 or 16.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k), key=lambda k: [int(n) for n in k.split('iOS-')[-1].split('-')], reverse=True)
          phones = [x for k in ios for x in d[k] if x['name'].startswith('iPhone')]
          for prefix in ('iPhone 17 Pro', 'iPhone 17', 'iPhone 16'):
              match = [x for x in phones if x['name'].startswith(prefix)]
              if match:
                  print(match[0]['udid'], file=sys.stderr, end=' ')
                  print(match[0]['name'], file=sys.stderr)
                  print(match[0]['udid'])
                  break
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" CoachMia/build/Debug-iphonesimulator/CoachMia.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.coachmia.app
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/00-welcome.png
          xcrun simctl terminate "$UDID" com.coachmia.app
          n=1
          for tab in home journey mia sessions community; do
            xcrun simctl launch "$UDID" com.coachmia.app -demoProfile -tab $tab
            sleep 6
            xcrun simctl io "$UDID" screenshot shots/$(printf %02d $n)-$tab.png
            xcrun simctl terminate "$UDID" com.coachmia.app
            n=$((n+1))
          done
          # Every other screen, sheet and quiz step (see ScreenshotScreen.swift).
          for screen in quiz1 quiz2 quiz3 result profile module membership booking group events recordings event chat; do
            xcrun simctl launch "$UDID" com.coachmia.app -demoProfile -screen $screen
            sleep 5
            xcrun simctl io "$UDID" screenshot shots/$(printf %02d $n)-$screen.png
            xcrun simctl terminate "$UDID" com.coachmia.app
            n=$((n+1))
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: screenshots
          path: shots
